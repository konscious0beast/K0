name: ptd-check
on:
  push:
    paths: ["prime-time-dungeon/**", "services/**", ".github/workflows/ptd-check.yml"]
  pull_request:
    paths: ["prime-time-dungeon/**", "services/**", ".github/workflows/ptd-check.yml"]
  workflow_dispatch: {}
  # 07 §11.4 (R4): the nightly real-time balance harness (200 seeds) — the narrow bands of 07 §11.1
  schedule:
    - cron: "17 2 * * *"
env:
  GODOT_VERSION: "4.7.2"
jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri unzip
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-stable-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
      - name: Import + tests + autoplay smoke
        # one test process on a dedicated runner: the wall-clock budgets of the unit tests are asserted here only
        # (TestCase.assert_time_budget); local parallel check.sh runs print them
        run: PTD_PERF_ASSERTS=1 GODOT=~/godot/godot prime-time-dungeon/tools/check.sh
      - name: Full run Floor 1 (bot, thorough + rush + dawdle, ~1.5 min)
        run: GODOT=~/godot/godot prime-time-dungeon/tools/fullrun.sh --strategy=all --log-dir=fullrun-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullrun-logs
          path: fullrun-logs/
      - name: Screenshots (gl_compatibility)
        run: |
          mkdir -p shots
          for s in res://art/gallery/character_gallery.tscn res://art/gallery/env_gallery.tscn res://art/gallery/vfx_gallery.tscn \
                   res://scenes/title/title.tscn res://scenes/exploration/exploration.tscn res://scenes/battle/battle.tscn \
                   res://scenes/safe_room/safe_room.tscn; do
            GODOT=~/godot/godot prime-time-dungeon/tools/check.sh --shot "$s" "shots/$(basename "$s" .tscn).png" 120 1280x720
          done
      - name: Render probe (03_ART A11)
        run: |
          mkdir -p shots
          GODOT=~/godot/godot prime-time-dungeon/tools/check.sh --shot res://art/gallery/render_probe.tscn \
            shots/render_probe.png 60 1280x720 | tee render_probe.log
          grep -q "RENDER_PROBE: OK" render_probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
  # 06-D: the M.O.D. live reference service (Python). Mocked Anthropic client only — no API key, no network calls.
  mod-brain-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "services/mod-brain[dev]"
      - name: pytest
        working-directory: services/mod-brain
        run: python -m pytest -q
  # 07 §11.4 (R4): tools/rt_balance.sh --nightly — 200 seeds per series (regular encounters × both heroes,
  # show boss + bosses × both heroes × Liga 0/1/2, bosses perfect / sloppy) and 50 floor sequences; the
  # tables, the RT-BAND verdicts against 07 §11.1 and the JSON as artifact. Fails on script errors; the
  # bands fail it only with --strict-bands (R5b, after calibrating `typical` from play-test replays).
  nightly-balance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-stable-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
      - name: Real-time balance harness (nightly, 200 seeds)
        run: |
          set -o pipefail
          mkdir -p rt-balance
          GODOT=~/godot/godot prime-time-dungeon/tools/rt_balance.sh --nightly --out=rt-balance/nightly.json \
            | tee rt-balance/nightly.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rt-balance
          path: rt-balance/
  # Playable builds for a pushed tag v* (README „Spielbare Builds“, 02_TECH §12.3): Linux, Windows, macOS (universal .app,
  # built-in ad-hoc signature, zipped by Godot so the executable bit survives) and the iOS Xcode project (project-only
  # export, works on Linux; team and signing are chosen in Xcode on the Mac). No secrets, no signing identities.
  export:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Godot + templates (verified against SHA512-SUMS.txt)
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          tpz="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          for f in SHA512-SUMS.txt "$editor.zip" "$tpz"; do curl -fsSL -o "$f" "$base/$f"; done
          sha512sum -c --ignore-missing SHA512-SUMS.txt
          unzip -q "$editor.zip" && mv "$editor" godot && chmod +x godot
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q "$tpz" -d tpl && mv tpl/templates/* "$templates/"
          rm -rf tpl "$tpz" "$editor.zip"
      - name: Export Linux, Windows, macOS, iOS (Xcode project)
        working-directory: prime-time-dungeon/game
        run: |
          godot() { ~/godot/godot --headless --path . "$@"; }
          godot --import
          mkdir -p ../build/linux ../build/windows ../build/macos ../build/ios
          godot --export-release "Linux" ../build/linux/PrimeTimeDungeon.x86_64
          godot --export-release "Windows" ../build/windows/PrimeTimeDungeon.exe
          godot --export-release "macOS" ../build/macos/PrimeTimeDungeon.zip
          # warns ".ipa can only be built on macOS. Leaving Xcode project …" — the Xcode project is the product
          godot --export-release "iOS" ../build/ios/PrimeTimeDungeon.xcodeproj
          for f in linux/PrimeTimeDungeon.x86_64 windows/PrimeTimeDungeon.exe macos/PrimeTimeDungeon.zip \
                   ios/PrimeTimeDungeon.pck ios/PrimeTimeDungeon.xcodeproj/project.pbxproj; do
            test -s "../build/$f" || { echo "::error::export output missing: build/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        id: up-macos
        with:
          name: PrimeTimeDungeon-${{ github.ref_name }}-macOS
          path: prime-time-dungeon/build/macos/PrimeTimeDungeon.zip
          compression-level: 0  # already a zip; Godot's zip keeps the executable bit of the .app
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: up-ios
        with:
          name: PrimeTimeDungeon-${{ github.ref_name }}-iOS-Xcode
          path: prime-time-dungeon/build/ios/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: up-windows
        with:
          name: PrimeTimeDungeon-${{ github.ref_name }}-Windows
          path: prime-time-dungeon/build/windows/PrimeTimeDungeon.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: up-linux
        with:
          name: PrimeTimeDungeon-${{ github.ref_name }}-Linux
          path: prime-time-dungeon/build/linux/PrimeTimeDungeon.x86_64
          if-no-files-found: error
      - name: Step summary
        working-directory: prime-time-dungeon/build
        env:
          URL_MACOS: ${{ steps.up-macos.outputs.artifact-url }}
          URL_IOS: ${{ steps.up-ios.outputs.artifact-url }}
          URL_WINDOWS: ${{ steps.up-windows.outputs.artifact-url }}
          URL_LINUX: ${{ steps.up-linux.outputs.artifact-url }}
        run: |
          size() { du -sh "$1" | cut -f1; }
          n="PrimeTimeDungeon-${GITHUB_REF_NAME}"
          {
            echo "### Spielbare Builds ${GITHUB_REF_NAME}"
            echo
            echo "| Artefakt | Inhalt | Größe |"
            echo "|---|---|---|"
            echo "| [$n-macOS]($URL_MACOS) | \`PrimeTimeDungeon.zip\` → \`Prime Time Dungeon.app\` (Universal: Apple Silicon + Intel, ad-hoc signiert) | $(size macos/PrimeTimeDungeon.zip) |"
            echo "| [$n-iOS-Xcode]($URL_IOS) | Xcode-Projekt \`PrimeTimeDungeon.xcodeproj\` (unsigniert, in Xcode bauen) | $(size ios) |"
            echo "| [$n-Windows]($URL_WINDOWS) | \`PrimeTimeDungeon.exe\` (x86_64) | $(size windows/PrimeTimeDungeon.exe) |"
            echo "| [$n-Linux]($URL_LINUX) | \`PrimeTimeDungeon.x86_64\` (vor dem Start \`chmod +x\`) | $(size linux/PrimeTimeDungeon.x86_64) |"
            echo
            readme="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/prime-time-dungeon/README.md"
            echo "Erster Start auf dem Mac, iPhone/iPad über Xcode: [README, Abschnitt 4 Spielbare Builds]($readme#4-spielbare-builds)"
          } >> "$GITHUB_STEP_SUMMARY"
