[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mod-brain"
version = "0.1.0"
description = "PRIME TIME DUNGEON — M.O.D. live: KI-Kommentar und begrenzte Regie-Twists (Referenzdienst, Stufe S0/S1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13,<2",
    "pydantic>=2.7,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["mod_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
